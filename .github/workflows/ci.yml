name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests are valid JSON; every listed skill has a SKILL.md
        run: |
          for f in .claude-plugin/*.json; do python3 -m json.tool "$f" >/dev/null; done
          python3 - <<'PY'
          import json, os, sys
          skills = json.load(open(".claude-plugin/plugin.json"))["skills"]
          missing = [s for s in skills if not os.path.isfile(os.path.join(s, "SKILL.md"))]
          sys.exit(f"missing SKILL.md: {missing}" if missing else 0)
          PY
